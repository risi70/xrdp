---
- name: Verify Phase 6 lab connectivity
  hosts: phase6
  gather_facts: false
  tasks:
    - name: Check SSH connectivity
      ansible.builtin.ping:

- name: Verify VDI services
  hosts: vdi
  gather_facts: false
  tasks:
    - name: Check XRDP service state
      ansible.builtin.command: systemctl is-active xrdp
      register: xrdp_state
      changed_when: false
      failed_when: xrdp_state.rc != 0

    - name: Check trusted BAF runtime config exists
      ansible.builtin.stat:
        path: /etc/xrdp/baf/runtime.conf
      register: baf_runtime
      failed_when: not baf_runtime.stat.exists

    - name: Check test user resolves through NSS
      ansible.builtin.command: getent passwd {{ lab_test_user }}
      changed_when: false

    - name: Run Broker-RDP Handle RDP-level smoke test
      ansible.builtin.command: >
        bash {{ xrdp_source_dir }}/test-lab/phase6/modec-smoke/modec-smoke.sh
      environment:
        XRDP_SRC: "{{ xrdp_source_dir }}"
        LAB_TEST_USER: "{{ lab_test_user }}"
        BAF_ISSUER: "{{ baf_issuer }}"
        BAF_AUDIENCE: "{{ baf_audience }}"
        BAF_TARGET: "{{ baf_target }}"
        BAF_REPLAY_SOCKET: "{{ baf_replay_socket }}"
      become: true
      changed_when: false
      tags:
        - modec-smoke

    - name: Run smart-card broker to Broker-RDP Handle session smoke test
      ansible.builtin.command: >
        bash {{ xrdp_source_dir }}/test-lab/phase6/modec-smoke/smartcard-smoke.sh
      environment:
        XRDP_SRC: "{{ xrdp_source_dir }}"
        LAB_TEST_USER: "{{ lab_test_user }}"
        BAF_ISSUER: "{{ baf_issuer }}"
        BAF_AUDIENCE: "{{ baf_audience }}"
        BAF_TARGET: "{{ baf_target }}"
        BAF_REPLAY_SOCKET: "{{ baf_replay_socket }}"
      become: true
      changed_when: false
      tags:
        - smartcard-smoke

    - name: Run SoftHSM2 smart-card removal/reinsertion smoke test
      ansible.builtin.command: >
        bash {{ xrdp_source_dir }}/test-lab/phase6/modec-smoke/softhsm-smoke.sh
      environment:
        XRDP_SRC: "{{ xrdp_source_dir }}"
        LAB_TEST_USER: "{{ lab_test_user }}"
        BAF_ISSUER: "{{ baf_issuer }}"
        BAF_AUDIENCE: "{{ baf_audience }}"
        BAF_TARGET: "{{ baf_target }}"
        BAF_REPLAY_SOCKET: "{{ baf_replay_socket }}"
      become: true
      changed_when: false
      tags:
        - softhsm-smoke
