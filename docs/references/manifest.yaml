# External references for BAF/RDSAAD development.
# Downloaded files are stored under docs/references/<supplier>/originals/ and are ignored by git.
# Verify license/terms before fetching or storing any document.

references:
  - id: microsoft-ms-rdpbcgr
    supplier: microsoft
    title: "[MS-RDPBCGR] Remote Desktop Protocol: Basic Connectivity and Graphics Remoting"
    url: "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rdpbcgr/"
    relevance: "RDP negotiation, pre-MCS flow, Server Nonce, Authentication Request/Result, RDSAAD semantics."
    fetch: true

  - id: microsoft-ms-rdpesc
    supplier: microsoft
    title: "[MS-RDPESC] Remote Desktop Protocol: Smart Card Virtual Channel Extension"
    url: "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rdpesc/"
    # Authoritative wire format for the chansrv --enable-smartcard redirection
    # code (SCARD_IOCTL_* set, section 3.1.4; call/return structures, 2.2.2/2.2.3;
    # NDR/RPCE type-serialization headers). Basis for the smart-card test vectors
    # in tests/baf/test_smartcard_scard.c and the security review
    # (broker-auth/UPSTREAM-MS-RDPESC-REVIEW.md). Reviewed revision: 17.0
    # (2024-04-23). Structures/IDL usable per the MS Open Specifications IP notice.
    relevance: "MS-RDPESC smart-card redirection: IOCTL codes, call/return structures, NDR marshaling, length range constraints (e.g. Transmit_Return cbRecvLength range(0,66560))."
    fetch: true

